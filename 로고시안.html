<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>로고 시안</title>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@400;500&family=Hahmlet:wght@300;500&display=swap" rel="stylesheet" />
<script src="시안06_Marcellus+Hahmlet/config.js"></script>
<script src="tools/logos.js"></script>
<style>
  :root {
    --f-display: 'Marcellus', serif; --f-label: 'Jost', sans-serif; --display-weight: 400;
    --paper: #F2F1EE; --ink: #111; --muted: rgba(17,17,17,.56); --line: rgba(17,17,17,.14);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Hahmlet', serif; font-weight: 300; }
  header { max-width: 1200px; margin: 0 auto; padding: 48px 24px 8px; }
  header h1 { margin: 0 0 10px; font-family: var(--f-display); font-weight: 400; font-size: 28px; letter-spacing: .04em; }
  header p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.8; }
  code { font-family: Consolas, monospace; font-size: 12.5px; background: rgba(17,17,17,.06); padding: 2px 6px; }
  .grid { max-width: 1200px; margin: 0 auto; padding: 32px 24px 80px; display: grid; gap: 24px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .card { border: 1px solid var(--line); background: #F7F6F3; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; }
  .tile { aspect-ratio: 1; display: grid; place-items: center; padding: 26px; }
  .tile.dark { background: var(--ink); color: var(--paper); }
  .tile svg { height: 100%; max-height: 120px; max-width: 100%; }
  .hero-mock {
    height: 92px; background: linear-gradient(135deg, #3a3a3a, #141414); color: #fff;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; padding: 0 16px;
    font-family: var(--f-label); font-size: 8.5px; letter-spacing: .22em; line-height: 1.5; text-transform: uppercase;
  }
  .hero-mock span:first-child { text-align: right; }
  .hero-mock svg { height: 48px; max-width: 120px; }
  .meta { padding: 16px 18px 18px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .meta h2 { margin: 0 0 4px; font-family: var(--f-display); font-weight: 400; font-size: 18px; letter-spacing: .04em; }
  .meta p { margin: 0; font-size: 13px; color: var(--muted); }
  .lg text { font-family: var(--f-display); font-weight: 400; fill: currentColor; text-anchor: middle; }
  .lg .lg-small, .lg .lg-ring { font-family: var(--f-label); letter-spacing: .2em; }
  .lg .lg-wide { letter-spacing: .12em; }
  .lg .lg-ring { text-anchor: start; }
</style>
</head>
<body>
<header>
  <h1>Logo Drafts</h1>
  <p>영문 Marcellus 기준 로고 시안 8종입니다. 마음에 드는 키를 <code>config.js</code> → <code>logo: '키'</code> 에 넣으면 인트로, 첫 화면 상단, 원형 배지 중앙에 함께 적용됩니다.<br>
     각 카드: 밝은 배경 / 어두운 배경 / 첫 화면 상단 실제 크기</p>
</header>
<div class="grid" id="grid"></div>
<script>
  var W = window.WEDDING, LG = window.WEDDING_LOGOS, grid = document.getElementById('grid');
  Object.keys(LG.list).forEach(function (key) {
    var L = LG.list[key], el = document.createElement('article');
    el.className = 'card';
    el.innerHTML =
      '<div class="tiles"><div class="tile">' + LG.render(key, W) + '</div><div class="tile dark">' + LG.render(key, W) + '</div></div>' +
      '<div class="hero-mock"><span>Two hearts &amp;<br>one promise</span>' + LG.render(key, W) + '<span>The wedding<br>invitation</span></div>' +
      '<div class="meta"><div><h2>' + L.name + '</h2><p>' + L.desc + '</p></div><code>' + key + '</code></div>';
    grid.appendChild(el);
  });
</script>
</body>
</html>
