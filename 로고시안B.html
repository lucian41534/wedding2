<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>두들 로고 시안</title>
<link rel="icon" href="assets/favicon/favicon.ico" sizes="any" />
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --acc: #EC4A26; --paper: #F2F1EE; --ink: #111; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #111; color: var(--paper); font-family: 'Jost', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  header { padding: 40px 24px 8px; max-width: 1200px; margin: 0 auto; }
  h1 { margin: 0 0 8px; font: 400 14px 'Jost', sans-serif; letter-spacing: .2em; }
  header p { margin: 0; color: rgba(242,241,238,.6); font-size: 13px; line-height: 1.7; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px; display: grid; gap: 28px; }
  article { display: grid; grid-template-columns: 1fr 1fr 220px; gap: 0; border-radius: 18px; overflow: hidden; }
  .tile { aspect-ratio: 1; display: grid; place-items: center; padding: 11%; }
  .tile img { max-width: 100%; max-height: 100%; }
  .paper { background: var(--paper); }
  .red { background: var(--acc); }
  .red img { filter: brightness(0) invert(1); }
  .meta { background: #1b1b1b; padding: 22px; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; }
  .meta h2 { margin: 0; font: 400 26px 'Marcellus', serif; }
  .meta p { margin: 6px 0 0; font-size: 13px; color: rgba(242,241,238,.62); line-height: 1.6; }
  .sizes { display: flex; align-items: end; gap: 12px; background: var(--paper); padding: 12px; border-radius: 10px; }
  .sizes img:nth-child(1) { height: 64px; } .sizes img:nth-child(2) { height: 40px; } .sizes img:nth-child(3) { height: 24px; }
  code { font-size: 12px; color: var(--acc); }
  @media (max-width: 760px) {
    article { grid-template-columns: 1fr 1fr; }
    .meta { grid-column: 1 / -1; }
  }
</style></head>
<body>
<header>
  <h1>DOODLE LOGO DRAFTS · 5</h1>
  <p>손그림(크레용·마커) 라인 로고 시안입니다. 왼쪽은 종이 배경, 가운데는 B안 버밀리언 배경(흰 선 반전), 오른쪽은 작은 크기(64 · 40 · 24px).<br>
  적용은 config.js 의 <code>logo: 'logo/doodle-이름.png'</code> 한 줄.</p>
</header>
<main id="list"></main>
<script>
  var L = [
    ['stamp', '01 · Stamp', '두 사람 얼굴 + JUN & YUNJI · 16.10.2027 원형 스탬프. 이름·날짜가 들어간 대표 로고형, 파비콘·공유 썸네일에도 적합.'],
    ['sticker', '02 · Sticker', '꽃 장식 타원 프레임 안에서 춤추는 신랑신부와 샴페인, 손글씨 Jun & Yunji. 보내주신 레퍼런스 무드.'],
    ['umbrella', '03 · Umbrella', '비 오는 횡단보도 위 한 우산 아래의 두 사람. 실제 사진(비 내리던 횡단보도) 스토리와 연결.'],
    ['toast', '04 · Toast', '건배하는 두 손과 하트. 글자 없이 가장 단순해 작은 크기에서도 잘 읽힘.'],
    ['carry', '05 · Carry', '부케를 든 신부를 안아 든 신랑. 보내주신 크레용 레퍼런스 방향, 검정 크레용 톤.']
  ];
  document.getElementById('list').innerHTML = L.map(function (l) {
    var src = 'assets/logo/doodle-' + l[0] + '.png';
    return '<article><div class="tile paper"><img src="' + src + '" alt=""></div>' +
      '<div class="tile red"><img src="' + src + '" alt=""></div>' +
      '<div class="meta"><div><h2>' + l[1] + '</h2><p>' + l[2] + '</p></div>' +
      '<div class="sizes"><img src="' + src + '" alt=""><img src="' + src + '" alt=""><img src="' + src + '" alt=""></div>' +
      '<code>logo/doodle-' + l[0] + '.png</code></div></article>';
  }).join('');
</script>
</body></html>
